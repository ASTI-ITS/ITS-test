name: ESP-IDF Firmware CI

on:
  push:
    branches: [test_branch_meynard, main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: 'ESP32 Target Chip (esp32s3)'
        required: false
        default: 'esp32s3'

jobs:
  build:
    name: Build Firmware with Docker Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    strategy:
      matrix:
        project:
          - OBD_BLE_FreeRTOS_C



    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache ccache compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-esp-idf-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-esp-idf-ccache-

      - name: Run Build via Docker Compose
        env:
          PROJECT: ${{ matrix.project }}
          IDF_TARGET: ${{ github.event.inputs.target || 'esp32s3' }}
        run: |
          mkdir -p .ccache
          docker compose -f docker-compose.ci.yml up \
            --abort-on-container-exit \
            --exit-code-from idf-builder

      - name: Verify build outputs
        run: |
          test -f ${{ matrix.project }}/build/${{ matrix.project }}.bin
          test -f ${{ matrix.project }}/build/bootloader/bootloader.bin
          test -f ${{ matrix.project }}/build/partition_table/partition-table.bin
          test -f ${{ matrix.project }}/build/flasher_args.json
          echo "Firmware compilation verified successfully!"

      - name: Upload Firmware Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: esp-idf-firmware-${{ github.event.inputs.target || 'esp32s3' }}-${{ github.sha }}
          path: |
            ${{ matrix.project }}/build/*.bin
            ${{ matrix.project }}/build/bootloader/bootloader.bin
            ${{ matrix.project }}/build/partition_table/partition-table.bin
            ${{ matrix.project }}/build/flasher_args.json
          if-no-files-found: error

      - name: Cleanup Docker Compose
        if: always()
        run: docker compose -f docker-compose.ci.yml down -v
