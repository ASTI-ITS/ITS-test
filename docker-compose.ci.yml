services:
  idf-builder:
    image: espressif/idf:v5.3
    container_name: idf-ci-builder
    environment:
      - IDF_TARGET=${IDF_TARGET:-esp32}
    volumes:
      - ./${PROJECT}:/project
    working_dir: /project
    command: >
      bash -c '
        set -euo pipefail
        echo "====================================================="
        echo "  ESP-IDF Docker Compose CI Pipeline                 "
        echo "  Target Chip: $$IDF_TARGET"
        echo "====================================================="

        # Clean build directory if generated from host environment
        if [ -d build ] && grep -rq "/home/" build/ 2>/dev/null; then
          echo "Detected host build artifacts in build/. Cleaning..."
          rm -rf build
        fi

        # Configure target chip if sdkconfig does not exist or target differs
        if [ ! -f sdkconfig ] || ! grep -q "CONFIG_IDF_TARGET.*$$IDF_TARGET" sdkconfig; then
          idf.py set-target "$$IDF_TARGET"
        fi

        # Compile application
        idf.py fullclean
        idf.py build

        # Ensure artifacts are readable by host users
        chmod -R a+rw build/ 2>/dev/null || true

        echo "====================================================="
        echo "  Build Succeeded! Firmware Artifacts:              "
        echo "====================================================="
        ls -lh build/*.bin build/bootloader/*.bin build/partition_table/*.bin
      '
